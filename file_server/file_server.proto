syntax = "proto3";

option go_package = "./proto";

service FileService {
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
}

message UploadChunkRequest {
  string file_path = 1;
  int64 offset = 2;
  bytes content = 3;
}

message UploadChunkResponse {
  bool success = 1;
  string message = 2;
}
